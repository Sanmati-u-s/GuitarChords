<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guitar Chords</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">
</head>

<body>

    <h1 class="chord">🎸 GUITAR CHORD DICTIONARY</h1>
    <h2 class="chord subtitle">All the chords you will need!</h2>

    <!-- MINOR CHORDS SECTION -->
    <section class="chord-section">
        <h3 class="section-title">Minor Chords</h3>
        <div class="chord-container">
            <button class="chord-btn minor" data-chord="Am">Am</button>
            <button class="chord-btn minor" data-chord="Bm">Bm</button>
            <button class="chord-btn minor" data-chord="Cm">Cm</button>
            <button class="chord-btn minor" data-chord="Dm">Dm</button>
            <button class="chord-btn minor" data-chord="Em">Em</button>
            <button class="chord-btn minor" data-chord="Fm">Fm</button>
            <button class="chord-btn minor" data-chord="Gm">Gm</button>
        </div>
    </section>
    
    <!-- MAJOR CHORDS SECTION -->
    <section class="chord-section">
        <h3 class="section-title">Major Chords</h3>
        <div class="chord-container">
            <button class="chord-btn major" data-chord="A">A</button>
            <button class="chord-btn major" data-chord="B">B</button>
            <button class="chord-btn major" data-chord="C">C</button>
            <button class="chord-btn major" data-chord="D">D</button>
            <button class="chord-btn major" data-chord="E">E</button>
            <button class="chord-btn major" data-chord="F">F</button>
            <button class="chord-btn major" data-chord="G">G</button>
        </div>
    </section>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
